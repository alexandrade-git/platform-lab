apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong
  namespace: argocd

spec:
  project: platform

  source:
    chart: kong
    repoURL: https://charts.konghq.com
    targetRevision: 2.52.0

    helm:
      values: |
        ingressController:
          enabled: true
          env:
            CONTROLLER_FEATURE_GATES: "GatewayAlpha=true"

        admin:
          enabled: true

        proxy:
          type: NodePort

        env:
          database: "off"

  destination:
    server: https://kubernetes.default.svc
    namespace: kong

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
